<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medright Medical Network Guide</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--line:#e3e6ea;--text:#1a1d21;--muted:#6b7280;--accent:#0f766e;--accent-bg:#e6f4f2;--chip:#eef0f3}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:16px 20px;position:sticky;top:0;z-index:5}
  h1{margin:0 0 2px;font-size:20px}
  .sub{color:var(--muted);font-size:13px}
  .filters{display:grid;grid-template-columns:2fr repeat(5,1fr) auto;gap:8px;margin-top:12px}
  .filters input,.filters select,.filters button{height:38px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;color:inherit;min-width:0;width:100%}
  .filters button{cursor:pointer;background:var(--chip);white-space:nowrap}
  main{padding:16px 20px;max-width:1500px;margin:0 auto}
  .count{color:var(--muted);margin:0 0 10px}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
  th{background:#fafbfc;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
  tr:last-child td{border-bottom:0}
  td.ar{direction:rtl;text-align:right;font-size:13px;color:#374151}
  td.name{font-weight:600}
  .badge{display:inline-block;padding:2px 7px;border-radius:999px;background:var(--accent-bg);color:var(--accent);font-size:11px;font-weight:600;margin:1px 2px 1px 0}
  .type{display:inline-block;padding:2px 7px;border-radius:6px;background:var(--chip);font-size:12px}
  a.tel{color:var(--accent);text-decoration:none;white-space:nowrap}
  .more{display:block;margin:14px auto;padding:10px 22px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font:inherit}
  @media (max-width:900px){
    .filters{grid-template-columns:1fr 1fr}
    .filters input{grid-column:1/-1}
    thead{display:none}
    table,tbody,tr,td{display:block;width:100%}
    tr{border-bottom:8px solid var(--bg)}
    td{border:0;padding:4px 12px}
    td:first-child{padding-top:12px}
    td:last-child{padding-bottom:12px}
    td.ar{text-align:right}
  }
</style>
</head>
<body>
<header>
  <h1>Medright Medical Network Guide</h1>
  <div class="sub">Hospitals, labs, pharmacies, doctors and more. Filter by plan, type, city and area.</div>
  <div class="filters">
    <input id="q" type="search" placeholder="Search provider, address, phone…">
    <select id="tier"><option value="">All plans</option></select>
    <select id="type"><option value="">All types</option></select>
    <select id="city"><option value="">All cities</option></select>
    <select id="loc"><option value="">All areas</option></select>
    <select id="spec"><option value="">All specialties</option></select>
    <button id="reset" type="button">Reset</button>
  </div>
</header>
<main>
  <p class="count" id="count"></p>
  <table>
    <thead><tr><th>Provider</th><th>Type</th><th>Specialty</th><th>City</th><th>Area</th><th>Address</th><th>Phone</th><th>Plans</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <button class="more" id="more" type="button" hidden>Show more</button>
</main>
<script src="data.js"></script>
<script>
const TIERS=["Elite","Premium","Classic","Regular","Basic"];
const PAGE=300;
const D=window.DATA; // [name,type,spec,city,loc,address,phone,tiermask]
const $=id=>document.getElementById(id);
const uniq=(i,rows=D)=>[...new Set(rows.map(r=>r[i]).filter(Boolean))].sort();
function fill(sel,vals,keep){const cur=keep?sel.value:"";sel.length=1;vals.forEach(v=>sel.add(new Option(v,v)));sel.value=vals.includes(cur)?cur:"";}
TIERS.forEach(t=>$("tier").add(new Option(t,t)));
fill($("type"),uniq(1));fill($("city"),uniq(3));fill($("loc"),uniq(4));fill($("spec"),uniq(2));
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tel=p=>p.split(/[\/,\-–]\s*|\s{2,}/).map(x=>x.trim()).filter(Boolean).map(x=>`<a class="tel" href="tel:${x.replace(/\D/g,"")}">${esc(x)}</a>`).join("<br>");
let filtered=[],shown=0;
function apply(){
  const q=$("q").value.trim().toLowerCase(),tier=$("tier").value,type=$("type").value,city=$("city").value,loc=$("loc").value,spec=$("spec").value;
  const tm=tier?1<<TIERS.indexOf(tier):0;
  filtered=D.filter(r=>(!tm||r[7]&tm)&&(!type||r[1]===type)&&(!city||r[3]===city)&&(!loc||r[4]===loc)&&(!spec||r[2]===spec)&&(!q||(r[0]+" "+r[5]+" "+r[6]+" "+r[4]).toLowerCase().includes(q)));
  $("count").textContent=`${filtered.length.toLocaleString()} of ${D.length.toLocaleString()} providers`;
  $("rows").innerHTML="";shown=0;render();
}
function render(){
  const slice=filtered.slice(shown,shown+PAGE);
  $("rows").insertAdjacentHTML("beforeend",slice.map(r=>`<tr><td class="name">${esc(r[0])}</td><td><span class="type">${esc(r[1])}</span></td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td>${esc(r[4])}</td><td class="ar">${esc(r[5])}</td><td>${tel(r[6])}</td><td>${TIERS.filter((t,i)=>r[7]&1<<i).map(t=>`<span class="badge">${t}</span>`).join("")}</td></tr>`).join(""));
  shown+=slice.length;$("more").hidden=shown>=filtered.length;
}
$("city").addEventListener("change",()=>{const c=$("city").value;fill($("loc"),uniq(4,c?D.filter(r=>r[3]===c):D),true);});
["q","tier","type","city","loc","spec"].forEach(id=>$(id).addEventListener("input",apply));
$("more").addEventListener("click",render);
$("reset").addEventListener("click",()=>{["q","tier","type","city","loc","spec"].forEach(id=>$(id).value="");fill($("loc"),uniq(4));apply();});
apply();
</script>
</body>
</html>
